[package]
name = "ripple-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ripple command line, engine and daemon"

[lib]
name = "ripple_cli"
path = "src/lib.rs"

[[bin]]
name = "ripple"
path = "src/main.rs"

[dependencies]
ripple-core.workspace = true
ripple-ruby.workspace = true
ripple-js.workspace = true
ripple-boundary.workspace = true
ripple-policy.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
clap = { version = "4.5", features = ["derive", "env"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
ignore = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
